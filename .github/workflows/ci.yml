name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saltzer
          POSTGRES_PASSWORD: saltzer
          POSTGRES_USER: saltzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltzer -d saltzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://saltzer:saltzer@localhost:5432/saltzer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm performance:web
      - run: pnpm --filter @saltzer/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
